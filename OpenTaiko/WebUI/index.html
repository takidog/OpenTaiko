<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTaiko 快速選曲</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <div><p class="eyebrow">OPEN TAIKO · REMOTE</p><h1>快速選曲</h1></div>
    <div id="connection" class="pill offline">連線中…</div>
  </header>

  <main>
    <section class="now-playing card">
      <div><span>目前畫面</span><strong id="stage">—</strong></div>
      <div><span>目前選曲</span><strong id="current-song">尚未選擇</strong></div>
      <div><span>玩家</span><strong id="players">—</strong></div>
      <div class="web-player">
        <span>網頁試聽</span>
        <strong id="web-preview-title">尚未播放</strong>
        <audio id="web-audio" controls preload="none"></audio>
      </div>
    </section>

    <section id="game-session" class="game-session card" hidden aria-live="polite">
      <div class="session-copy">
        <div class="session-heading"><span id="playback-status" class="pill">遊戲狀態</span><strong id="playing-song">—</strong></div>
        <span id="playing-difficulty" class="session-detail">—</span>
        <div class="progress-track" role="progressbar" aria-label="歌曲進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="game-progress"></span></div>
        <div class="session-time"><span id="elapsed-time">0:00</span><span id="duration-time">0:00</span></div>
        <p id="session-hint" class="session-hint"></p>
      </div>
      <div id="game-controls" class="game-controls">
        <button id="game-retry" type="button" class="large-control secondary">重試</button>
        <button id="game-exit" type="button" class="large-control danger">退出並回到選歌</button>
      </div>
    </section>

    <nav class="tabs" aria-label="主要功能">
      <button class="tab active" data-tab="catalog-panel">選取歌曲</button>
      <button class="tab" data-tab="playlist-panel">自選播放清單 <span id="playlist-count">0</span></button>
      <button class="tab" data-tab="history-panel">最近遊玩</button>
    </nav>

    <section id="catalog-panel" class="tab-panel active">
      <div class="section-title">
        <div><p class="eyebrow">CATALOG</p><h2>歌曲</h2></div>
        <span id="song-count">0 首</span>
      </div>
      <form id="filters" class="filters">
        <input id="query" type="search" placeholder="搜尋標題、作者或資料夾" autocomplete="off">
        <select id="genre" aria-label="分類"><option value="">所有分類</option></select>
        <select id="difficulty" aria-label="難度">
          <option value="">所有難度</option><option value="easy">Easy</option><option value="normal">Normal</option>
          <option value="hard">Hard</option><option value="oni">Oni</option><option value="ura">Ura</option>
          <option value="tower">Tower</option><option value="dan">Dan</option>
        </select>
        <input id="min-level" type="number" min="1" max="99" placeholder="最低★" aria-label="最低星數">
        <input id="max-level" type="number" min="1" max="99" placeholder="最高★" aria-label="最高星數">
        <label class="check"><input id="favorite-only" type="checkbox">只顯示最愛</label>
      </form>
      <div id="error" class="error" hidden></div>
      <div id="songs" class="song-grid" aria-live="polite"></div>
      <div id="song-sentinel" class="load-sentinel" role="status" aria-live="polite">向下捲動以載入更多歌曲</div>
    </section>

    <section id="playlist-panel" class="tab-panel" hidden>
      <div class="section-title">
        <div><p class="eyebrow">MY LIST</p><h2>自選播放清單</h2></div>
        <span>可拖曳歌曲調整順序</span>
      </div>
      <div class="playlist-toolbar card">
        <select id="playlist-select" aria-label="選擇播放清單"></select>
        <button id="playlist-create">新增</button>
        <button id="playlist-rename" class="secondary">重新命名</button>
        <button id="playlist-delete" class="danger">刪除</button>
        <button id="playlist-export" class="secondary">匯出 JSON</button>
        <label class="button-label secondary">匯入 JSON<input id="playlist-import" type="file" accept="application/json,.json" hidden></label>
      </div>
      <p id="playlist-none" class="empty" hidden>目前沒有播放清單，請按「新增」。</p>
      <p id="playlist-empty" class="empty">這個清單還沒有歌曲，請從「選取歌曲」加入。</p>
      <div id="playlist" class="song-grid"></div>
    </section>

    <section id="history-panel" class="tab-panel" hidden>
      <div class="section-title"><div><p class="eyebrow">RECENT</p><h2>最近遊玩</h2></div></div>
      <div id="history" class="history-list"></div>
    </section>
  </main>

  <template id="song-template">
    <article class="song card">
      <div class="song-head">
        <div class="song-copy"><span class="genre"></span><h3></h3><p class="meta"></p></div>
        <button class="favorite icon-button" type="button" title="加入最愛" aria-label="加入最愛">♡</button>
      </div>
      <div class="difficulties"></div>
      <div class="actions preview-actions">
        <button class="web-preview secondary">網頁試聽</button>
        <button class="game-preview secondary">遊戲 Preview</button>
        <button class="playlist-action secondary">加入清單</button>
      </div>
      <div class="actions game-actions">
        <button class="select secondary">選取</button><button class="play">開始遊玩</button>
      </div>
    </article>
  </template>
  <dialog id="playlist-dialog">
    <form method="dialog" class="dialog-card card">
      <div class="dialog-head"><div><p class="eyebrow">PLAYLISTS</p><h2>加入播放清單</h2></div><button value="close" class="icon-button" aria-label="關閉">×</button></div>
      <strong id="playlist-dialog-song"></strong>
      <div id="playlist-dialog-options" class="playlist-options"></div>
      <button id="playlist-dialog-create" type="button">新增播放清單</button>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
